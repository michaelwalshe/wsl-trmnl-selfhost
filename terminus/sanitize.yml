css:
  properties:
    - "--screen-w"
    - "--screen-h"
    - "--pixel-ratio"
    - "--dither-pixel-ratio"
    - "--ui-scale"
    - "--gap-scale"
    # Added for trmnl-calendar-weather's full.liquid. Checked directly
    # against Sanitize::Config::RELAXED's own defaults (see
    # `bundle exec ruby -e 'require "sanitize"; puts
    # Sanitize::Config::RELAXED[:css][:properties]'` inside the web
    # container) rather than assumed: RELAXED already permits essentially
    # every standard property this template uses (display, position,
    # top/left/width/height, grid-template-columns, background, clip-path,
    # -webkit-line-clamp, etc.) unmodified. Only two kinds of gap exist:
    #
    # 1. CSS custom properties, which RELAXED allows none of by default.
    #    These carry Liquid-computed values (gutter width, panel-relative
    #    pixel heights, the sun-curve clip-path points), so they can't be
    #    replaced with a framework token -- the same category as Terminus's
    #    own --screen-w/--screen-h additions above.
    # 2. `place-content`, the one shorthand RELAXED doesn't cover (its
    #    longhands align-content/justify-content are fine). Left as the
    #    shorthand rather than rewritten because this repo's own
    #    `trmnlp lint` caps `justify-content` occurrences at 6 total across
    #    all four templates -- allowlisting one property fits its existing
    #    constraints better than spending that budget.
    - "--ad-h"
    - "--gut"
    - "--head-h"
    - "--ink"
    - "--paper"
    - "--sun-h"
    - "--sun-shape"
    - "--sun-under"
    - "--tile-size"
    - "--wx-h"
    - place-content
    - white-space
    - width
